name: Inventory one-shot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-oneshot
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run once (coarse public summary only)
        env:
          WATCH_CONFIG_JSON: ${{ secrets.WATCH_CONFIG_JSON }}
          RUN_PRIVATE_DIR: ${{ runner.temp }}/inventory-monitor-private
        run: python -m inventory_monitor.runner
